name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 浏览器回归按主题模板的 demo 数据与英文默认配置断言，本站已换成
  # 自己的数据与文案，因此它们只在手动触发时运行；定时任务只跑诊断与构建。
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

concurrency:
  # 把事件类型放进分组，避免一次 push 取消正在跑的 nightly。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      comments: ${{ steps.filter.outputs.comments }}
      styles: ${{ steps.filter.outputs.styles }}
    steps:
      - name: Checkout history for path detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Manual runs, nightly runs and new branch pushes deliberately run every suite.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "comments=true" >> "$GITHUB_OUTPUT"
            echo "styles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
            head="$CURRENT_SHA" # the checked-out PR merge commit
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          # The orchestrator keeps the guard and classifier outputs separate,
          # then gives the guard precedence if the classifier itself changed.
          scripts/ci/detect-browser-suites.sh "$base" "$head" "$GITHUB_OUTPUT"

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      CONTENT_DIR: .content-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot-triggered runs cannot read repository secrets, so the private
      # content repository is unavailable there. Fall back to the in-repo content
      # instead of failing before anything is compiled.
      - name: Resolve content source
        id: content
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          if [[ -n "$CONTENT_REPO_TOKEN" ]]; then
            echo "external=true" >> "$GITHUB_OUTPUT"
          else
            echo "external=false" >> "$GITHUB_OUTPUT"
            echo "CONTENT_DIR=" >> "$GITHUB_ENV"
            echo "::warning::CONTENT_REPO_TOKEN is unavailable; validating against the in-repo content."
          fi

      - name: Checkout content
        if: steps.content.outputs.external == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: industry2419/my-blog-content
          ref: main
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The content repository intentionally ships no demo posts, so the
      # regression fixtures provide the article set these suites assert on.
      - name: Add regression fixture content
        if: steps.content.outputs.external == 'true'
        run: |
          mkdir -p .content-src/content/posts .content-src/content/series
          cp -R tests/fixtures/content/posts/. .content-src/content/posts/
          cp -R tests/fixtures/content/series/. .content-src/content/series/

      - name: Materialize content
        run: pnpm content:sync

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check Svelte diagnostics
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Validate atom manifest
        run: pnpm check:manifest

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  windows-paths:
    name: Windows path regressions
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows path regressions
        run: node --test tests/paths.test.mjs tests/overlay.test.mjs tests/pagefind.test.mjs

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [26.13.0]
    env:
      CI: true
      CONTENT_DIR: .content-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot-triggered runs cannot read repository secrets, so the private
      # content repository is unavailable there. Fall back to the in-repo content
      # instead of failing before the build starts.
      - name: Resolve content source
        id: content
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          if [[ -n "$CONTENT_REPO_TOKEN" ]]; then
            echo "external=true" >> "$GITHUB_OUTPUT"
          else
            echo "external=false" >> "$GITHUB_OUTPUT"
            echo "CONTENT_DIR=" >> "$GITHUB_ENV"
            echo "::warning::CONTENT_REPO_TOKEN is unavailable; building with the in-repo content."
          fi

      - name: Checkout content
        if: steps.content.outputs.external == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: industry2419/my-blog-content
          ref: main
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

  comment-tests:
    name: Comment regression fixtures
    needs: changes
    # 浏览器回归只手动触发：断言绑定主题 demo 数据与英文文案，本站已个性化。
    if: needs.changes.outputs.comments == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, waline, twikoo, no-toc]
    env:
      CI: true
      CONTENT_DIR: .content-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify content repository token
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          if [[ -z "$CONTENT_REPO_TOKEN" ]]; then
            echo "::error::Missing CONTENT_REPO_TOKEN secret; the private content repository cannot be checked out."
            exit 1
          fi

      - name: Checkout content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: industry2419/my-blog-content
          ref: main
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The content repository intentionally ships no demo posts, so the
      # regression fixtures provide the article set these suites assert on.
      # The per-mode config overlay below only owns `config/`, so this content
      # survives the second `content:sync` run.
      - name: Add regression fixture content
        run: |
          mkdir -p .content-src/content/posts .content-src/content/series
          cp -R tests/fixtures/content/posts/. .content-src/content/posts/
          cp -R tests/fixtures/content/series/. .content-src/content/series/

      # Materialize the real content once; the fixture steps below only overlay
      # the config/ directory and rely on this content being present.
      - name: Materialize content
        run: pnpm content:sync

      # Comments are off by default, so this run covers the zero-footprint cases.
      - name: Run comment, content, a11y and swup container regressions with comments disabled
        if: matrix.mode == 'disabled'
        run: pnpm exec playwright test tests/site/comments.spec.ts tests/site/waline.spec.ts tests/site/mdx.spec.ts tests/site/a11y.spec.ts tests/site/swup-navigation.spec.ts

      # The fixture enables Waline through the content-repository config overlay;
      # the specs mock its SDK, stylesheet, emoji packs and API.
      - name: Enable the Waline fixture
        if: matrix.mode == 'waline'
        run: pnpm content:sync
        env:
          CONTENT_DIR: tests/fixtures/content/waline

      - name: Run comment regressions with Waline enabled
        if: matrix.mode == 'waline'
        run: pnpm exec playwright test tests/site/comments.spec.ts tests/site/waline.spec.ts

      # The Twikoo fixture matches the SDK mock in comments.spec.ts.
      - name: Enable the Twikoo fixture
        if: matrix.mode == 'twikoo'
        run: pnpm content:sync
        env:
          CONTENT_DIR: tests/fixtures/content/twikoo

      - name: Run comment regressions with Twikoo enabled
        if: matrix.mode == 'twikoo'
        run: pnpm exec playwright test tests/site/comments.spec.ts

      # The fixture turns the TOC sidebar widget off, the configuration where
      # the layout's fallback #toc container is the only thing keeping swup
      # navigation soft; the spec's default-configuration cases skip there.
      - name: Enable the no-toc fixture
        if: matrix.mode == 'no-toc'
        run: pnpm content:sync
        env:
          CONTENT_DIR: tests/fixtures/content/no-toc

      - name: Run swup container regressions with the TOC widget disabled
        if: matrix.mode == 'no-toc'
        run: pnpm exec playwright test tests/site/swup-navigation.spec.ts

  comments:
    # Keep the required check name stable for branch protection.
    name: Comment regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, comment-tests]
    if: always()
    steps:
      - name: Verify comment regression result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.comments }}
          TEST_RESULT: ${{ needs.comment-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Changed-path detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" && "$SHOULD_RUN" != "false" ]]; then
            echo "::error::Changed-path detection produced an invalid comments value."
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Comment regressions are manual-only; nothing to verify on $EVENT_NAME."
            exit 0
          fi
          if [[ "$SHOULD_RUN" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "::error::Comment regression matrix did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "Comment regression check passed (suite selected: $SHOULD_RUN)."

  style-tests:
    name: Style regression shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.styles == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      CI: true
      CONTENT_DIR: .content-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify content repository token
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          if [[ -z "$CONTENT_REPO_TOKEN" ]]; then
            echo "::error::Missing CONTENT_REPO_TOKEN secret; the private content repository cannot be checked out."
            exit 1
          fi

      - name: Checkout content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: industry2419/my-blog-content
          ref: main
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add regression fixture content
        run: |
          mkdir -p .content-src/content/posts .content-src/content/series
          cp -R tests/fixtures/content/posts/. .content-src/content/posts/
          cp -R tests/fixtures/content/series/. .content-src/content/series/

      - name: Materialize content
        run: pnpm content:sync

      - name: Run site browser regression shard
        run: bash scripts/ci/run-style-regressions.sh "${{ matrix.shard }}"

  styles:
    # Keep the required check name stable while running four parallel shards.
    name: Style regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, style-tests]
    if: always()
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      SHOULD_RUN: ${{ needs.changes.outputs.styles }}
      TEST_RESULT: ${{ needs.style-tests.result }}

    steps:
      - name: Verify style regression result
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Changed-path detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" && "$SHOULD_RUN" != "false" ]]; then
            echo "::error::Changed-path detection produced an invalid styles value."
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Style regressions are manual-only; nothing to verify on $EVENT_NAME."
            exit 0
          fi
          if [[ "$SHOULD_RUN" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "::error::Style regression matrix did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "Style regression check passed (suite selected: $SHOULD_RUN)."
