# 可复用的内容校验流程：由内容仓在 PR / push 时调用，让内容问题在合并前就暴露，
# 而不是等部署构建失败。
#
# 本文件只有 workflow_call 触发器，不会自行运行。
#
# 内容仓调用示例（.github/workflows/validate.yml）：
#
#   name: Validate content
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     validate:
#       uses: OWNER/REPO/.github/workflows/content-validate.yml@main
#       with:
#         theme_repository: OWNER/REPO
#       # 主题仓私有时才需要：
#       # secrets:
#       #   theme_token: ${{ secrets.THEME_REPO_TOKEN }}

name: Validate content

on:
  workflow_call:
    inputs:
      theme_repository:
        description: "主题（代码）仓，形如 OWNER/REPO"
        type: string
        required: true
      theme_ref:
        description: "主题仓的 ref"
        type: string
        required: false
        default: main
    secrets:
      theme_token:
        description: "主题仓私有时用于 checkout 的 token"
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Schema and structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      # 无 repository 参数时 checkout 的是调用方，也就是内容仓本身。
      - name: Checkout content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: content

      - name: Checkout theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.theme_repository }}
          ref: ${{ inputs.theme_ref }}
          path: theme
          token: ${{ secrets.theme_token || github.token }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Read the version from the theme's manifest, not from this repo:
          # the caller is a content repository, which may not pin a package
          # manager at all. Hardcoding one here is what made this step fail
          # against a theme pinned to pnpm 11 (ERR_PNPM_BAD_PM_VERSION).
          package_json_file: theme/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: theme/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: theme
        run: pnpm install --frozen-lockfile --prefer-offline

      # 第一关：目录结构、keep 冲突、写入构建期生成物路径等契约问题，
      # 外加 config/*.yaml 的类型校验（拼错的键、越界的枚举都会在这里失败）。
      - name: Validate content structure and config
        working-directory: theme
        env:
          CONTENT_DIR: ${{ github.workspace }}/content
        run: pnpm content:validate

      # 第二关：物化后用 Astro 自己的 collection schema 校验 frontmatter。
      - name: Validate frontmatter schemas
        working-directory: theme
        env:
          CONTENT_DIR: ${{ github.workspace }}/content
        run: |
          set -euo pipefail
          pnpm content:sync
          pnpm exec astro sync

      - name: Summarize
        if: always()
        working-directory: theme
        run: |
          set -euo pipefail
          {
            echo "### Content validation"
            echo ""
            echo "- 主题仓：\`${{ inputs.theme_repository }}@${{ inputs.theme_ref }}\`"
            if [ -f content.lock.json ]; then
              echo ""
              echo '```json'
              cat content.lock.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
