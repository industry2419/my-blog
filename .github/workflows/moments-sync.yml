name: Moments Sync

# 定时从 RSSHub 拉取 B 站动态，并把快照与配图提交回仓库。
# 构建阶段只读本地快照，因此站点运行时不依赖 RSSHub 或 B 站图床的连通性。
on:
  schedule:
    # 每天 04:10（Asia/Shanghai）
    - cron: "10 20 * * *"
  workflow_dispatch:

concurrency:
  group: moments-sync
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  sync:
    name: Sync Bilibili moments
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Bilibili moments
        run: pnpm moments:sync

      - name: Commit snapshot and images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/bilibili-moments.json
          if [ -d public/images/moments/bilibili ]; then
            git add -A public/images/moments/bilibili
          fi
          if git diff --cached --quiet; then
            echo "No moments changes to commit."
            exit 0
          fi
          git commit -m "chore(moments): sync Bilibili dynamics"
          git push
