name: Moments Sync

# 定时从 RSSHub 拉取 B 站动态，并把快照与配图提交回仓库。
# 构建阶段只读本地快照，因此站点运行时不依赖 RSSHub 或 B 站图床的连通性。
on:
  schedule:
    # 每天 04:10（Asia/Shanghai）
    - cron: "10 20 * * *"
  workflow_dispatch:

# 与其他定时数据同步任务共用并发组：串行执行，避免同时向 main 推送。
concurrency:
  group: scheduled-data-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  sync:
    name: Sync Bilibili moments
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Bilibili moments
        run: pnpm moments:sync

      - name: Commit snapshot and images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 未配置 uid 时同步脚本会跳过，快照文件可能根本不存在；
          # 直接 stage 不存在的路径会让 `set -e` 在无变更时也失败。
          if [ -e src/data/bilibili-moments.json ]; then
            git add -A src/data/bilibili-moments.json
          fi
          if [ -d public/images/moments/bilibili ]; then
            git add -A public/images/moments/bilibili
          fi
          if git diff --cached --quiet; then
            echo "No moments changes to commit."
            exit 0
          fi
          git commit -m "chore(moments): sync Bilibili dynamics"
          git push || {
            echo "Push rejected; recommitting on top of origin/${GITHUB_REF_NAME}."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft FETCH_HEAD
            if git diff --cached --quiet; then
              echo "Remote already contains this snapshot."
              exit 0
            fi
            git commit -m "chore(moments): sync Bilibili dynamics"
            git push
          }
