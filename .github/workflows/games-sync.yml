name: Games Sync

# 定时从 Enka.Network 拉取游戏资历数据（等级 / 成就 / 高难战绩），
# 并从米游社官方版本 PV 同步当前版本主视觉封面；
# 把不含凭据的快照与封面提交回仓库。构建阶段只读本地快照，运行时不发外部请求。
on:
  schedule:
    # 每天 04:10（Asia/Shanghai）
    - cron: "10 20 * * *"
  workflow_dispatch:

concurrency:
  group: games-sync
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  sync:
    name: Sync game data
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync game credentials
        run: pnpm games:sync --game all

      - name: Sync game covers
        # 封面源不可用时保留上一次封面，不阻塞资历快照提交。
        continue-on-error: true
        run: pnpm games:covers

      - name: Sync Steam library
        # 未配置 Steam secrets 或未启用 providers.steam 时脚本自行跳过。
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: pnpm games:steam

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/games-snapshots public/games-art
          if git diff --cached --quiet; then
            echo "No games data changes to commit."
            exit 0
          fi
          git commit -m "chore(games): sync game data"
          git push
